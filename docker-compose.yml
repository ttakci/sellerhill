version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: zonds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonds_db
      POSTGRES_USER: zonds_user
      POSTGRES_PASSWORD: zonds_password_change_in_production
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zonds_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zonds_user -d zonds_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optional - for future sessions/caching)
  redis:
    image: redis:7-alpine
    container_name: zonds_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - zonds_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (optional - database management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zonds_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zonds.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - zonds_network
    depends_on:
      - postgres

  # Local OpenAI-compatible LLM (dev/trickle). Prod/bulk uses hosted OpenAI/Groq via LLM_* env.
  ollama:
    image: ollama/ollama:latest
    container_name: zonds_ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - zonds_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  ollama_data:
    driver: local

networks:
  zonds_network:
    driver: bridge
