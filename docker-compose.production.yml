# ============================================
# Zonds - Production Docker Compose
# For Coolify / standalone deployment
# ============================================

services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonds_db
      POSTGRES_USER: zonds_user
      POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zonds_user -d zonds_db']
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- NestJS API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Database
      DATABASE_URL: postgresql://zonds_user:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/zonds_db
      DB_POOL_MAX: 20

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # Frontend URL (OAuth redirects + email links)
      FRONTEND_URL: https://zonds.takci.cloud

      # JWT
      JWT_SECRET: CHANGE_ME_JWT_SECRET
      JWT_REFRESH_SECRET: CHANGE_ME_JWT_REFRESH_SECRET
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # Logging
      LOG_LEVEL: info

      # eBay OAuth
      EBAY_CLIENT_ID: CHANGE_ME_EBAY_CLIENT_ID
      EBAY_CLIENT_SECRET: CHANGE_ME_EBAY_CLIENT_SECRET
      EBAY_REDIRECT_URI: https://zonds.takci.cloud/api/v1/ebay/callback
      EBAY_RUNAME: CHANGE_ME_EBAY_RUNAME
      EBAY_ENVIRONMENT: production
      EBAY_AUTH_URL: https://auth.ebay.com/oauth2/authorize
      EBAY_TOKEN_URL: https://api.ebay.com/identity/v1/oauth2/token
      EBAY_REST_API_URL: https://api.ebay.com
      EBAY_XML_API_URL: https://api.ebay.com/ws/api.dll

      # Keepa
      KEEPA_API_KEY: CHANGE_ME_KEEPA_API_KEY
      KEEPA_API_URL: https://api.keepa.com/product

      # Amazon
      AMAZON_ENCRYPTION_KEY: CHANGE_ME_AMAZON_ENCRYPTION_KEY

      # Scraper
      SCRAPER_API_KEY: CHANGE_ME_SCRAPER_API_KEY
      ZON_SCRAPPER_CONCURRENCY: 1
      ZON_SCRAPPER_TIMEOUT_MS: 60000
      ZON_SCRAPPER_USE_PROXY: 'false'

      # Rate Limiting
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100

      # Email (SMTP)
      SMTP_HOST: CHANGE_ME_SMTP_HOST
      SMTP_PORT: 587
      SMTP_SECURE: 'false'
      SMTP_USER: CHANGE_ME_SMTP_USER
      SMTP_PASSWORD: CHANGE_ME_SMTP_PASSWORD
      SMTP_FROM: CHANGE_ME_SMTP_FROM
    volumes:
      - browser_state:/app/.browser-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- React Web (nginx) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_NODE_ENV: production
        VITE_ENABLE_AUTH: "true"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  browser_state:
