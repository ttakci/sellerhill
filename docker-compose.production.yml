# ============================================
# SellerHill — PRODUCTION Docker Compose (Coolify)
#
# For the sandbox/test deployment use docker-compose.test.yml instead. The two
# files build the same images from the same code; only configuration differs.
#
# Architecture: SAME-ORIGIN nginx proxy
#   - web (nginx) serves the React SPA and proxies /api/* → api:3000
#   - ONE public domain (set in Coolify UI). No CORS, no second domain.
#
# Stateful services (PostgreSQL, Redis) are NOT defined here. They are managed
# by Coolify as separate Database resources on the same Docker network; their
# connection strings are injected via env vars. See docs/deployment-guide.md.
#
# WHAT BELONGS HERE vs THE ADMIN PANEL
#   This file carries only bootstrap + secrets: connection strings, crypto
#   keys, provider API credentials and process identity. Operational tuning
#   (Keepa refresh cadence and kill switch, AI content toggle, quota
#   enforcement, admin warning thresholds, SMTP host/user/password, matching
#   tolerances, evidence retention) is stored in the `platform_settings` table
#   and edited at /admin → Settings, with no redeploy. Any value set here is
#   still honoured as the fallback when no override row exists, so leaving
#   these unset is the normal case.
#
#   Amazon browser-automation proxying is self-service: a user optionally sets
#   host/port/credentials per Amazon buyer account from the app (migration
#   080). There is nothing to configure here or at /admin for it anymore.
# ============================================

services:
  # ---- NestJS API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Database — Coolify-managed PostgreSQL.
      # Copy the INTERNAL connection string from the PostgreSQL resource panel.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify (internal conn string from PostgreSQL resource)}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}

      # Redis — Coolify-managed Redis (host/port from the Redis resource).
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in Coolify (from Redis resource)}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0

      # Frontend URL (OAuth redirects + email links) — same domain as web.
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in Coolify (e.g. https://app.sellerhill.com)}

      # CORS — allowed origins (comma-separated). Same-origin SPA requests carry
      # no Origin header so this rarely matters, but cross-origin calls (and
      # any separately-hosted client) need it. Defaults to FRONTEND_URL so a
      # deploy that only sets FRONTEND_URL still allows its own web origin
      # instead of silently falling back to main.ts's localhost:5173 default.
      # Override explicitly if more than one origin must be allowed.
      CORS_ORIGINS: ${CORS_ORIGINS:-${FRONTEND_URL}}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify env vars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in Coolify env vars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # eBay OAuth — PRODUCTION endpoints.
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:?Set EBAY_CLIENT_ID in Coolify env vars}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:?Set EBAY_CLIENT_SECRET in Coolify env vars}
      EBAY_REDIRECT_URI: ${EBAY_REDIRECT_URI:?Set EBAY_REDIRECT_URI in Coolify (https://<domain>/api/v1/ebay/callback)}
      EBAY_RUNAME: ${EBAY_RUNAME:?Set EBAY_RUNAME in Coolify env vars}
      EBAY_ENVIRONMENT: production
      EBAY_AUTH_URL: https://auth.ebay.com/oauth2/authorize
      EBAY_TOKEN_URL: https://api.ebay.com/identity/v1/oauth2/token
      EBAY_REST_API_URL: https://api.ebay.com
      EBAY_XML_API_URL: https://api.ebay.com/ws/api.dll

      # Keepa — sole product data provider (metadata + price + stock).
      # Only the API key lives here. Refresh cadence, batch size, quarantine
      # policy and the master kill switch are managed at /admin → Settings.
      KEEPA_API_KEY: ${KEEPA_API_KEY:?Set KEEPA_API_KEY in Coolify env vars}
      KEEPA_API_URL: https://api.keepa.com/product
      # Worker concurrency is read at worker registration, so it stays here.
      KEEPA_REFRESH_WORKER_CONCURRENCY: ${KEEPA_REFRESH_WORKER_CONCURRENCY:-1}

      # Amazon (32-byte hex key for AES-256-GCM credential encryption).
      # Also encrypts proxy passwords and secret platform settings — rotating
      # it invalidates all three, so treat it as a permanent secret.
      AMAZON_ENCRYPTION_KEY: ${AMAZON_ENCRYPTION_KEY:?Set AMAZON_ENCRYPTION_KEY in Coolify env vars}

      # Worker concurrency — read at worker registration (restart to change).
      LISTINGS_WORKER_CONCURRENCY: ${LISTINGS_WORKER_CONCURRENCY:-2}
      AUTO_FULFILL_QUEUE_CONCURRENCY: ${AUTO_FULFILL_QUEUE_CONCURRENCY:-1}
      AMAZON_ORDER_SYNC_CONCURRENCY: ${AMAZON_ORDER_SYNC_CONCURRENCY:-2}
      # Platform-wide ceiling on concurrent Playwright actions, and therefore
      # the throughput ceiling: capacity is this × 86,400 browser-seconds/day.
      # A RESOURCE guard, not the anti-ban control (that is per-account and
      # hardcoded). Past ~400 buyer accounts this becomes the binding
      # constraint — but lower AMAZON_ORDER_SYNC_CRON (admin panel) FIRST,
      # since order-list scraping costs accounts × ticks/day regardless of
      # sales. Budget ~150–300 MB RSS per unit and raise API_MEMORY_LIMIT with it.
      AMAZON_GLOBAL_CONCURRENCY: ${AMAZON_GLOBAL_CONCURRENCY:-5}

      # Playwright browser-state + evidence locations (bind to the volumes below).
      BROWSER_STATE_DIR: /app/.browser-state
      FULFILLMENT_EVIDENCE_DIR: /app/fulfillment-evidence

      # LLM transport (provider credentials only; the content toggle and model
      # behavior are managed in the admin panel / listing groups).
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTENT_MODEL: ${LLM_CONTENT_MODEL:-gemini-3.1-flash-lite}
      EBAY_ASPECTS_LLM_ENABLED: ${EBAY_ASPECTS_LLM_ENABLED:-false}
      EBAY_ASPECTS_LLM_MAX_PER_LISTING: ${EBAY_ASPECTS_LLM_MAX_PER_LISTING:-3}

      # Google OAuth (optional — the API boots without it and the FE hides the button).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Stripe (Billing/Invoicing/Tax) — LIVE keys here (sk_live_/whsec_ from
      # the live-mode Dashboard). Without them billing fails safe: catalog and
      # summary still work, checkout/portal 409. Quota enforcement itself is a
      # separate admin-panel toggle.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

      # Rate Limiting
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}

      # Email (SMTP) — bootstrap values only. Once an admin edits mail settings
      # at /admin → Settings the DB override wins, and the password there is
      # stored encrypted. Leave unset to configure entirely from the panel.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # Per-account Chromium profiles — losing these only forces a re-login.
      - browser_state:/app/.browser-state
      # Auto-fulfill evidence screenshots. TTL-swept by the app; not backed up.
      - fulfillment_evidence:/app/fulfillment-evidence
      # JSON logs (logger.config.ts) — tailed by the promtail service below.
      - api_logs:/app/apps/api/logs
    healthcheck:
      # `/api/health/live` is the liveness probe (no DB dependency), so a brief
      # database outage does not cause a restart loop.
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # Each resident Chromium context costs ~150–300 MB on top of the Node
          # heap. The idle-eviction sweep bounds how many stay alive; this cap
          # is the backstop. Raise it with the active-account count.
          memory: ${API_MEMORY_LIMIT:-6G}
    networks:
      - coolify
    # NOTE: no depends_on for postgres/redis — they live in separate Coolify
    # resources. Create + start the DB resources BEFORE the first app deploy
    # (see deployment guide). If the API boots before the DB is ready, the
    # migration fails and `restart: unless-stopped` retries until it connects.

  # ---- React Web (nginx) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # SAME-ORIGIN: relative path. nginx proxies /api → api:3000,
        # so the SPA calls <same-domain>/api/v1/* with no CORS.
        VITE_API_BASE_URL: /api/v1
        VITE_NODE_ENV: production
        VITE_ENABLE_AUTH: 'true'
        # Mirrors the api service's EBAY_ENVIRONMENT.
        VITE_EBAY_ENVIRONMENT: production
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # tawk.to live-chat widget (optional). See CLAUDE.md "Customer support
        # widget — tawk.to".
        VITE_TAWKTO_PROPERTY_ID: ${VITE_TAWKTO_PROPERTY_ID:-6a77cbcad1e0df1d455e2131}
        VITE_TAWKTO_WIDGET_ID: ${VITE_TAWKTO_WIDGET_ID:-1jvhv843q}
        # Stripe publishable key — unconsumed by any FE code today, provisioned
        # ahead of a future Stripe.js/Elements surface.
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - coolify

  # ---- Log tracing (Loki + Promtail + Grafana) ----
  # Promtail tails the api service's JSON log files via the shared api_logs
  # volume. Grafana intentionally publishes no ports — reach it via an SSH
  # tunnel to this VPS, or add a Coolify domain + auth for it deliberately.
  # See CLAUDE.md "Observability — Log tracing (Loki/Promtail/Grafana)".
  loki:
    build:
      context: ./docker/loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - coolify

  promtail:
    build:
      context: ./docker/promtail
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
    volumes:
      - api_logs:/var/log/sellerhill-api:ro
      - promtail_positions:/tmp/positions
    command: -config.expand-env=true -config.file=/etc/promtail/config.yml
    networks:
      - coolify
    depends_on:
      - loki

  grafana:
    build:
      context: ./docker/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in Coolify env vars}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - coolify
    depends_on:
      - loki

volumes:
  browser_state:
  fulfillment_evidence:
  api_logs:
  loki_data:
  grafana_data:
  promtail_positions:

# Attach both services to Coolify's shared network so they reach the managed
# PostgreSQL and Redis resources (which live on the external `coolify` network)
# by hostname, AND so nginx (web) can resolve the `api` service name.
# Verify the name with `docker network ls` on the VPS; rename if it differs.
networks:
  coolify:
    external: true
