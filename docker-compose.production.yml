# ============================================
# Zonds - Production Docker Compose (TEST / SANDBOX)
# For Coolify deployment
# Secrets (passwords, API keys) injected via Coolify env vars.
# ============================================

services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonds_db
      POSTGRES_USER: zonds_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify env vars}
    # Localhost-only binding — reach via SSH tunnel, not exposed to internet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zonds_user -d zonds_db']
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- NestJS API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Database
      DATABASE_URL: postgresql://zonds_user:${POSTGRES_PASSWORD}@postgres:5432/zonds_db
      DB_POOL_MAX: 20

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # Frontend URL (OAuth redirects + email links)
      FRONTEND_URL: https://zonds.takci.cloud

      # JWT
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify env vars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in Coolify env vars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # Logging
      LOG_LEVEL: info

      # eBay OAuth (SANDBOX)
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:?Set EBAY_CLIENT_ID in Coolify env vars}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:?Set EBAY_CLIENT_SECRET in Coolify env vars}
      EBAY_REDIRECT_URI: https://zonds-api.takci.cloud/api/v1/ebay/callback
      EBAY_RUNAME: ${EBAY_RUNAME:?Set EBAY_RUNAME in Coolify env vars}
      EBAY_ENVIRONMENT: sandbox
      EBAY_AUTH_URL: https://auth.sandbox.ebay.com/oauth2/authorize
      EBAY_TOKEN_URL: https://api.sandbox.ebay.com/identity/v1/oauth2/token
      EBAY_REST_API_URL: https://api.sandbox.ebay.com
      EBAY_XML_API_URL: https://api.sandbox.ebay.com/ws/api.dll

      # Keepa
      KEEPA_API_KEY: ${KEEPA_API_KEY:?Set KEEPA_API_KEY in Coolify env vars}
      KEEPA_API_URL: https://api.keepa.com/product

      # Amazon
      AMAZON_ENCRYPTION_KEY: ${AMAZON_ENCRYPTION_KEY:?Set AMAZON_ENCRYPTION_KEY in Coolify env vars}

      # Scraper
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?Set SCRAPER_API_KEY in Coolify env vars}
      ZON_SCRAPPER_CONCURRENCY: 1
      ZON_SCRAPPER_TIMEOUT_MS: 60000
      ZON_SCRAPPER_USE_PROXY: 'false'

      # Rate Limiting
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100

      # Email (SMTP)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: 'true'
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in Coolify env vars}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in Coolify env vars}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in Coolify env vars}
    volumes:
      - browser_state:/app/.browser-state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- React Web (nginx) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: https://zonds-api.takci.cloud/api/v1
        VITE_NODE_ENV: production
        VITE_ENABLE_AUTH: "true"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  browser_state:
