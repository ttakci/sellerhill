# ============================================
# Zonds - Production Docker Compose (TEST / SANDBOX)
# For Coolify deployment
#
# Architecture: SAME-ORIGIN nginx proxy
#   - web (nginx) serves the React SPA and proxies /api/* → api:3000
#   - ONE public domain (set in Coolify UI). No CORS, no second domain.
#
# Stateful services (PostgreSQL, Redis) are NOT defined here.
# They are managed by Coolify as separate Database resources, on the same
# Docker network. Their connection strings are injected via env vars:
#   DATABASE_URL  → copy internal connection string from the PostgreSQL resource
#   REDIS_*       → host/port (and optional password) from the Redis resource
# See docs/deployment-guide.md.
# ============================================

services:
  # ---- NestJS API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      # Database — Coolify-managed PostgreSQL.
      # Copy the INTERNAL connection string from the PostgreSQL resource panel.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify (internal conn string from PostgreSQL resource)}
      DB_POOL_MAX: 20

      # Redis — Coolify-managed Redis (host/port from the Redis resource).
      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in Coolify (from Redis resource)}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0

      # Frontend URL (OAuth redirects + email links) — same domain as web.
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in Coolify (e.g. https://zonds.takci.cloud)}

      # CORS — allowed origins (comma-separated). Same-origin SPA requests carry
      # no Origin header so this rarely matters, but set it for correctness.
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # JWT
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify env vars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in Coolify env vars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # Logging
      LOG_LEVEL: info

      # eBay OAuth (SANDBOX)
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:?Set EBAY_CLIENT_ID in Coolify env vars}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:?Set EBAY_CLIENT_SECRET in Coolify env vars}
      EBAY_REDIRECT_URI: ${EBAY_REDIRECT_URI:?Set EBAY_REDIRECT_URI in Coolify (https://<domain>/api/v1/ebay/callback)}
      EBAY_RUNAME: ${EBAY_RUNAME:?Set EBAY_RUNAME in Coolify env vars}
      EBAY_ENVIRONMENT: sandbox
      EBAY_AUTH_URL: https://auth.sandbox.ebay.com/oauth2/authorize
      EBAY_TOKEN_URL: https://api.sandbox.ebay.com/identity/v1/oauth2/token
      EBAY_REST_API_URL: https://api.sandbox.ebay.com
      EBAY_XML_API_URL: https://api.sandbox.ebay.com/ws/api.dll

      # Keepa
      KEEPA_API_KEY: ${KEEPA_API_KEY:?Set KEEPA_API_KEY in Coolify env vars}
      KEEPA_API_URL: https://api.keepa.com/product

      # Amazon (32-byte hex key for AES-256-GCM credential encryption)
      AMAZON_ENCRYPTION_KEY: ${AMAZON_ENCRYPTION_KEY:?Set AMAZON_ENCRYPTION_KEY in Coolify env vars}

      # Scraper
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:?Set SCRAPER_API_KEY in Coolify env vars}
      ZON_SCRAPPER_CONCURRENCY: 1
      ZON_SCRAPPER_TIMEOUT_MS: 60000
      ZON_SCRAPPER_USE_PROXY: 'false'

      # Rate Limiting
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100

      # Email (SMTP)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_SECURE: 'true'
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in Coolify env vars}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in Coolify env vars}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in Coolify env vars}
    volumes:
      # Playwright/Amazon session cookies — persistent, app-specific state.
      - browser_state:/app/.browser-state
    # NOTE: no depends_on for postgres/redis — they live in separate Coolify
    # resources. Create + start the DB resources BEFORE the first app deploy
    # (see deployment guide). If the API boots before the DB is ready, the
    # migration fails and `restart: unless-stopped` retries until it connects.

  # ---- React Web (nginx) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # SAME-ORIGIN: relative path. nginx proxies /api → api:3000,
        # so the SPA calls <same-domain>/api/v1/* with no CORS.
        VITE_API_BASE_URL: /api/v1
        VITE_NODE_ENV: production
        VITE_ENABLE_AUTH: "true"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  browser_state:
