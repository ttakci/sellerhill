services:
  postgres-integration:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: sellerhill_integration_test
      POSTGRES_USER: sellerhill_test
      POSTGRES_PASSWORD: sellerhill_test
    ports:
      - '${INTEGRATION_POSTGRES_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./docker/postgres/init.integration.sql:/docker-entrypoint-initdb.d/002-integration.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U sellerhill_test -d sellerhill_integration_test && psql -U sellerhill_test -d sellerhill_integration_test -tAc "SELECT 1 FROM pg_extension WHERE extname=''vector''" | grep -q 1',
        ]
      interval: 2s
      timeout: 5s
      retries: 20

  redis-integration:
    image: redis:7-alpine
    ports:
      - '${INTEGRATION_REDIS_PORT:-56379}:6379'
    tmpfs:
      - /data
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20
