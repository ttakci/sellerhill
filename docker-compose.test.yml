# ============================================
# SellerHill — TEST / SANDBOX Docker Compose (Coolify)
#
# Same images and same code as docker-compose.production.yml; only the
# configuration differs. Use this for the VPS test deployment:
#   - eBay SANDBOX endpoints (no real listings, no real money)
#   - debug logging
#   - lower worker concurrency (the test VPS shares CPU with Postgres + Redis)
#
# Stateful services (PostgreSQL, Redis) are Coolify-managed resources on the
# same Docker network — not defined here. See docs/deployment-guide.md.
#
# Operational tuning is NOT in this file. Keepa refresh cadence and its kill
# switch, AI content, quota enforcement, SMTP settings, matching tolerances and
# admin thresholds are edited at /admin → Settings and stored in
# `platform_settings`. Env vars here are only the fallback used when no
# override row exists. Amazon browser-automation proxying is self-service
# (per Amazon buyer account, set from the app) — nothing to configure here.
# ============================================

services:
  # ---- NestJS API ----
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      # `production` keeps the same runtime code paths as prod — the test env
      # differs by configuration only, never by a code branch.
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify (internal conn string from PostgreSQL resource)}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}

      REDIS_HOST: ${REDIS_HOST:?Set REDIS_HOST in Coolify (from Redis resource)}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0

      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in Coolify (e.g. https://sellerhill.takci.cloud)}
      # Defaults to FRONTEND_URL so a deploy that only sets FRONTEND_URL still
      # allows its own web origin — CORS_ORIGINS silently falling back to
      # main.ts's http://localhost:5173 default (when left unset) is what
      # blocked registration in test with "Origin '...' is not allowed by
      # CORS". Override explicitly if more than one origin must be allowed.
      CORS_ORIGINS: ${CORS_ORIGINS:-${FRONTEND_URL}}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify env vars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in Coolify env vars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      LOG_LEVEL: ${LOG_LEVEL:-debug}

      # eBay OAuth — SANDBOX endpoints.
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:?Set EBAY_CLIENT_ID in Coolify env vars}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:?Set EBAY_CLIENT_SECRET in Coolify env vars}
      EBAY_REDIRECT_URI: ${EBAY_REDIRECT_URI:?Set EBAY_REDIRECT_URI in Coolify (https://<domain>/api/v1/ebay/callback)}
      EBAY_RUNAME: ${EBAY_RUNAME:?Set EBAY_RUNAME in Coolify env vars}
      EBAY_ENVIRONMENT: sandbox
      EBAY_AUTH_URL: https://auth.sandbox.ebay.com/oauth2/authorize
      EBAY_TOKEN_URL: https://api.sandbox.ebay.com/identity/v1/oauth2/token
      EBAY_REST_API_URL: https://api.sandbox.ebay.com
      EBAY_XML_API_URL: https://api.sandbox.ebay.com/ws/api.dll

      # Keepa hits the LIVE API even from the test env (there is no sandbox),
      # so it spends real tokens. Turn "Background refresh enabled" OFF at
      # /admin → Settings when the test env is idle.
      KEEPA_API_KEY: ${KEEPA_API_KEY:?Set KEEPA_API_KEY in Coolify env vars}
      KEEPA_API_URL: https://api.keepa.com/product
      KEEPA_REFRESH_WORKER_CONCURRENCY: ${KEEPA_REFRESH_WORKER_CONCURRENCY:-1}

      AMAZON_ENCRYPTION_KEY: ${AMAZON_ENCRYPTION_KEY:?Set AMAZON_ENCRYPTION_KEY in Coolify env vars}

      # Kept low: the test VPS runs Postgres, Redis, Playwright, API and web.
      LISTINGS_WORKER_CONCURRENCY: ${LISTINGS_WORKER_CONCURRENCY:-1}
      AUTO_FULFILL_QUEUE_CONCURRENCY: ${AUTO_FULFILL_QUEUE_CONCURRENCY:-1}
      AMAZON_ORDER_SYNC_CONCURRENCY: ${AMAZON_ORDER_SYNC_CONCURRENCY:-1}
      # Platform-wide ceiling on concurrent Playwright actions (resource guard,
      # not the anti-ban control — that is per-account and hardcoded). Left at
      # the code default here; test carries few accounts. See the production
      # compose file for the capacity math.
      AMAZON_GLOBAL_CONCURRENCY: ${AMAZON_GLOBAL_CONCURRENCY:-5}

      BROWSER_STATE_DIR: /app/.browser-state
      FULFILLMENT_EVIDENCE_DIR: /app/fulfillment-evidence

      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTENT_MODEL: ${LLM_CONTENT_MODEL:-gemini-3.1-flash-lite}
      EBAY_ASPECTS_LLM_ENABLED: ${EBAY_ASPECTS_LLM_ENABLED:-false}
      EBAY_ASPECTS_LLM_MAX_PER_LISTING: ${EBAY_ASPECTS_LLM_MAX_PER_LISTING:-3}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}

      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}

      # Leave unset and configure mail entirely from /admin → Settings.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - browser_state:/app/.browser-state
      - fulfillment_evidence:/app/fulfillment-evidence
      - api_logs:/app/apps/api/logs
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # 16 GB test VPS shared with Postgres/Redis — leave headroom.
          memory: ${API_MEMORY_LIMIT:-4G}
    networks:
      - coolify

  # ---- React Web (nginx) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_NODE_ENV: production
        VITE_ENABLE_AUTH: 'true'
        # Mirrors the api service's EBAY_ENVIRONMENT — item links must point at
        # sandbox.ebay.com, since sandbox item ids do not exist on ebay.com.
        VITE_EBAY_ENVIRONMENT: sandbox
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # tawk.to live-chat widget (optional). See CLAUDE.md "Customer support
        # widget — tawk.to".
        VITE_TAWKTO_PROPERTY_ID: ${VITE_TAWKTO_PROPERTY_ID:-6a77cbcad1e0df1d455e2131}
        VITE_TAWKTO_WIDGET_ID: ${VITE_TAWKTO_WIDGET_ID:-1jvhv843q}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - coolify

  # ---- Log tracing (Loki + Promtail + Grafana) ----
  # Promtail tails the api service's JSON log files via the shared api_logs
  # volume. Grafana intentionally publishes no ports — reach it via an SSH
  # tunnel to this VPS, or add a Coolify domain + auth for it deliberately.
  # See CLAUDE.md "Observability — Log tracing (Loki/Promtail/Grafana)".
  loki:
    build:
      context: ./docker/loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - coolify

  promtail:
    build:
      context: ./docker/promtail
    restart: unless-stopped
    environment:
      ENVIRONMENT: test
    volumes:
      - api_logs:/var/log/sellerhill-api:ro
      - promtail_positions:/tmp/positions
    command: -config.expand-env=true -config.file=/etc/promtail/config.yml
    networks:
      - coolify
    depends_on:
      - loki

  grafana:
    build:
      context: ./docker/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in Coolify env vars}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - coolify
    depends_on:
      - loki

volumes:
  browser_state:
  fulfillment_evidence:
  api_logs:
  loki_data:
  grafana_data:
  promtail_positions:

networks:
  coolify:
    external: true
