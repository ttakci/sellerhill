<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4E0"/>
      <stop offset="100%" stop-color="#00A0B0"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Circuit Icon -->
  <g transform="translate(210,410)" filter="url(#gl)">
    <!-- Central hexagon (outline) -->
    <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" fill="none" stroke="#00D4E0" stroke-width="2.5"/>
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#00D4E0" opacity="0.15"/>

    <!-- Top-right hex (filled) -->
    <polygon points="60,-28 77.4,-18 77.4,2 60,14 42.6,2 42.6,-18" fill="#00D4E0" opacity="0.7"/>
    <!-- Bottom-right hex -->
    <polygon points="55,38 68.6,46 68.6,62 55,70 41.4,62 41.4,46" fill="#00D4E0" opacity="0.5"/>
    <!-- Top-left hex -->
    <polygon points="-50,-22 -36.6,-13 -36.6,3 -50,12 -63.4,3 -63.4,-13" fill="#00D4E0" opacity="0.6"/>
    <!-- Bottom-left hex -->
    <polygon points="-45,40 -31.6,48 -31.6,64 -45,72 -58.4,64 -58.4,48" fill="#00D4E0" opacity="0.35"/>
    <!-- Small far-right hex -->
    <polygon points="90,-8 98.6,-3 98.6,7 90,12 81.4,7 81.4,-3" fill="#00D4E0" opacity="0.4"/>
    <!-- Small far-left hex -->
    <polygon points="-78,8 -69.4,13 -69.4,23 -78,28 -86.6,23 -86.6,13" fill="#00D4E0" opacity="0.3"/>
    <!-- Tiny accent hex -->
    <polygon points="30,-50 37,-46 37,-38 30,-34 23,-38 23,-46" fill="#00D4E0" opacity="0.45"/>
    <polygon points="-25,65 -18,69 -18,77 -25,81 -32,77 -32,69" fill="#00D4E0" opacity="0.25"/>

    <!-- Circuit connection lines -->
    <line x1="29" y1="-5" x2="43" y2="-15" stroke="#00D4E0" stroke-width="1.5" opacity="0.5"/>
    <line x1="25" y1="10" x2="42" y2="45" stroke="#00D4E0" stroke-width="1.5" opacity="0.4"/>
    <line x1="-29" y1="-5" x2="-37" y2="-12" stroke="#00D4E0" stroke-width="1.5" opacity="0.5"/>
    <line x1="-20" y1="20" x2="-32" y2="48" stroke="#00D4E0" stroke-width="1.5" opacity="0.4"/>
    <line x1="60" y1="-10" x2="81" y2="-5" stroke="#00D4E0" stroke-width="1" opacity="0.4"/>
    <line x1="-50" y1="5" x2="-69" y2="14" stroke="#00D4E0" stroke-width="1" opacity="0.35"/>
    <line x1="15" y1="-30" x2="23" y2="-42" stroke="#00D4E0" stroke-width="1" opacity="0.3"/>

    <!-- Motion fragments (streaks going left) -->
    <rect x="-105" y="-6" width="3" height="14" rx="1.5" fill="#00D4E0" opacity="0.85"/>
    <rect x="-115" y="-9" width="3" height="11" rx="1.5" fill="#00D4E0" opacity="0.7"/>
    <rect x="-124" y="-4" width="3" height="15" rx="1.5" fill="#00D4E0" opacity="0.55"/>
    <rect x="-132" y="-7" width="2.5" height="12" rx="1.2" fill="#00D4E0" opacity="0.4"/>
    <rect x="-139" y="-2" width="2" height="9" rx="1" fill="#00D4E0" opacity="0.3"/>
    <rect x="-145" y="-5" width="2" height="7" rx="1" fill="#00D4E0" opacity="0.2"/>
    <rect x="-110" y="6" width="2.5" height="10" rx="1.2" fill="#00D4E0" opacity="0.5"/>
    <rect x="-118" y="3" width="2" height="8" rx="1" fill="#00D4E0" opacity="0.35"/>

    <!-- Node dots at hex vertices -->
    <circle cx="60" cy="-28" r="3" fill="#00D4E0" opacity="0.9"/>
    <circle cx="55" cy="38" r="2.5" fill="#00D4E0" opacity="0.7"/>
    <circle cx="-50" cy="-22" r="2" fill="#00D4E0" opacity="0.6"/>
    <circle cx="90" cy="-8" r="2" fill="#00D4E0" opacity="0.5"/>
  </g>

  <!-- Main Text: ZonDS -->
  <text x="350" y="440" font-family="'Inter','Montserrat','Segoe UI',system-ui,sans-serif" font-size="145" font-weight="700" letter-spacing="-3">
    <tspan fill="url(#cg)">Zon</tspan><tspan fill="url(#sg)" dx="4">DS</tspan>
  </text>

  <!-- Tagline -->
  <text x="430" y="500" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" letter-spacing="5" opacity="0.75">
    Simplified Solutions
  </text>
</svg>
