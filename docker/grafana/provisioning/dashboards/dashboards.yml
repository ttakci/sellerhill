# Auto-loads any dashboard JSON dropped into this folder — no manual import.
apiVersion: 1

providers:
  - name: SellerHill
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
