asyncapi: 2.0.0
info:
  title: eBay Notifications
  version: 1.0.0
  description: This contract defines eBay notification for ITEM_MARKED_SHIPPED.
channels:
  ITEM_MARKED_SHIPPED:
    subscribe:
      message:
        $ref: '#/components/messages/message'
      bindings:
        http:
          type: request
          method: POST
          headers:
            type: object
            properties:
              Content-Type:
                type: string
                enum: ['application/json']
components:
  messages:
    message:
      headers:
        type: object
        properties:
          X-EBAY-SIGNATURE:
            description: ECC message signature header used to verify the payload.
            type: string
      payload:
        type: object
        properties:
          metadata:
            $ref: '#/components/schemas/MetaData'
          notification:
            $ref: '#/components/schemas/Notification'

  schemas:
    MetaData:
      type: object
      description: 'This type specifies the metadata included with the notification.'
      properties:
        topic:
          type: string
          description: 'This is the unique identifier of the Notification topic.'
        schemaVersion:
          type: string
          description: 'This specifies the version number of the topic schema.'
        deprecated:
          type: boolean
          description: 'This boolean field indicates whether or not the topic is active or deprecated.'
          default: 'false'

    Notification:
      type: object
      description: 'This type includes information about the notification.'
      properties:
        notificationId:
          type: string
          description: 'This is the unique identifier of the specific notification.'
        eventDate:
          type: string
          description: 'This is the timestamp that indicates the date and time (in UTC format) when the event that triggered the notification was sent to the recipient.'
        publishDate:
          type: string
          description: 'This is the timestamp that indicates the date and time (in UTC format) when the notification was sent to the recipient.'
        publishAttemptCount:
          type: integer
          description: 'This integer value indicates whether this is the first, second, or third attempt to send the notification to the recipient. When a notification is sent successfully the first time, the integer value returned will be 1.'
        data:
         description: 'This container consists of specific information related to the item marked shipped data.'
         $ref: '#/components/schemas/ItemMarkedShippedData'

    ItemMarkedShippedData:
      type: object
      description: 'This type defines the payload for the <code>ITEM_MARKED_SHIPPED</code> event.'
      properties:
        trackingNumber:
          type: string
          description: This string is the shipment tracking number.
        carrier:
          type: string
          description: This string is the shipping carrier (e.g., USPS, UPS, FedEx).
        shippedDate:
          type: string
          format: date-time
          description: This timestamp indicates when the item was marked as shipped.
        orderId:
          type: string
          description: The unique identifier of the order associated with the shipment.
        itemId:
          type: string
          description: The unique identifier of the listing associated with the shipment.
        transactionId:
          type: string
          description: The unique identifier of the transaction associated with the shipment.
        lineItemId:
          type: string
          description: The unique identifier of the order line item associated with the shipment.
        publicUserId:
          type: string
          description: This string is the immutable user identifier associated with the seller.
        username:
          type: string
          description: >
            The seller's username.<br><br><span class="tablenote"><strong>Note:</strong> Effective September 26, 2025, select developers will no longer receive username data for U.S. users through this field. Instead, an immutable user ID will be returned in its place. For more information, please refer to <a href="/api-docs/static/data-handling-update.html" target="_blank">Data Handling Compliance</a>. </span>.